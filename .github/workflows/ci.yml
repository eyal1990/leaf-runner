name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Check syntax
        run: node --check prove2me.mjs
      - name: Install dependencies
        run: npm ci
      - name: Run offline tests
        run: npm test

  lean:
    name: Lean integration (six compiler checks)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install pinned Lean and Lake
        shell: bash
        run: |
          set -euo pipefail
          toolchain="$(tr -d '\r\n' < .github/lean-toolchain)"
          version="${toolchain#leanprover/lean4:v}"
          mkdir -p "$RUNNER_TEMP/lean"
          curl --fail --location --retry 3 \
            "https://github.com/leanprover/lean4/releases/download/v${version}/lean-${version}-linux.tar.zst" \
            -o "$RUNNER_TEMP/lean.tar.zst"
          tar --zstd -xf "$RUNNER_TEMP/lean.tar.zst" --strip-components=1 -C "$RUNNER_TEMP/lean"
          "$RUNNER_TEMP/lean/bin/lean" --version
          "$RUNNER_TEMP/lean/bin/lake" --version
          echo "$RUNNER_TEMP/lean/bin" >> "$GITHUB_PATH"
          echo "LEAN_TEST_BINARY=$RUNNER_TEMP/lean/bin/lean" >> "$GITHUB_ENV"
      - run: npm run test:lean

  browser:
    name: Chromium desktop and mobile smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Upload browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure
          path: |
            playwright-report/
            test-results/
          retention-days: 7
